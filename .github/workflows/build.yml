name: Build plugin

on:
  push:
    branches:
      - main
      - "fix/**"
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.SubtitleCat.csproj

      - name: Build (Release)
        run: dotnet build Jellyfin.Plugin.SubtitleCat.csproj -c Release --no-restore

      - name: Publish plugin files
        run: dotnet publish Jellyfin.Plugin.SubtitleCat.csproj -c Release --no-restore -o publish

      - name: Stage plugin folder
        run: |
          set -e
          rm -rf stage
          mkdir -p stage/SubtitleCat_1.0.5.0
          cp publish/Jellyfin.Plugin.SubtitleCat.dll stage/SubtitleCat_1.0.5.0/
          cp publish/HtmlAgilityPack.dll stage/SubtitleCat_1.0.5.0/
          cp meta.json stage/SubtitleCat_1.0.5.0/
          cd stage
          zip -r ../SubtitleCat_1.0.5.0.zip SubtitleCat_1.0.5.0

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleCat-plugin-1.0.5.0
          path: SubtitleCat_1.0.5.0.zip
          if-no-files-found: error
