name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.SubtitleCat.csproj

      - name: Build (Release)
        run: dotnet build Jellyfin.Plugin.SubtitleCat.csproj -c Release --no-restore

      - name: Stage plugin folder
        run: |
          mkdir -p stage/SubtitleCat_1.0.0.0
          cp bin/Release/net8.0/Jellyfin.Plugin.SubtitleCat.dll stage/SubtitleCat_1.0.0.0/
          cp bin/Release/net8.0/HtmlAgilityPack.dll stage/SubtitleCat_1.0.0.0/
          cp meta.json stage/SubtitleCat_1.0.0.0/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleCat-plugin
          path: stage/SubtitleCat_1.0.0.0/
          if-no-files-found: error
