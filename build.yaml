changelog: |
  ## v1.0.5.0
  - Use subtitlecat's own quality signals: rank results by user rating, download
    count and file size instead of trusting the order the site returned them in.
  - Require a result to share a distinctive word with the searched title. The
    site's year-only fallback used to hand Jellyfin an unrelated film of the same
    year as the subtitle track.
  - Drop results rated bad by users.
  - Offer at most one result per language, so Jellyfin stops producing
    `<video>.<lang>.0.srt` / `.1.srt` / `.2.srt` duplicates next to the video.
  - Stop inspecting candidates and fallback queries once the requested language
    has been served (the missing-subtitles task was taking hours per library).
  - Show rating, download count and size on each picker row.
  ## v1.0.4.0
  - Fix subtitle downloads. Detail-page links are root-absolute
    (`/subs/766/x.zh-zh-CN.srt`); `Uri.TryCreate(..., Absolute)` reported those as
    local `file:///subs/...` URIs on Unix, so every download failed with
    "The 'file' scheme is not supported".
  - Show the language on each search result (e.g. `ABW-276 [Chinese (Simplified)]`)
    so Simplified / Traditional / other rows are no longer indistinguishable.
  - Log which languages a detail page offers, and refuse non-http download urls
    with a readable warning instead of an exception from inside HttpClient.
  ## v1.0.3.0
  - Fix: SubtitleCat search results emit relative hrefs (`subs/<id>/<name>.html`),
    but the XPath required a leading slash, so every search matched 0 nodes and
    silently returned no candidates.
  - Add log warnings when no subtitle links are found, and when the search page
    responds with a non-2xx status, so future markup changes are visible.
  ## v1.0.0.0
  - Initial release: search + download subtitles from subtitlecat.com for movies and episodes.
